<!doctype html>
<html><head><meta charset="utf-8"><title>Studio guide test</title></head>
<body style="margin:0">
<pre id="result">running</pre>
<iframe id="guide" style="width:1400px;height:1000px;border:0"></iframe>
<script src="lib.js"></script>
<script>
// Renders guide.html in a frame: every section, every live demo (real schemas decoded by the Studio code).
(async () => {
  const frame = document.getElementById('guide');
  await new Promise((resolve) => {
    frame.onload = resolve;
    frame.src = '../guide.html';
  });
  const d = frame.contentDocument, w = frame.contentWindow;
  const errors = [];
  w.addEventListener('error', (e) => errors.push(e.message));

  T.test('sections render', async () => {
    await T.until(() => d.querySelectorAll('section').length > 0, 5000, 'sections');
    const ids = Array.from(d.querySelectorAll('section[id]')).map((s) => s.id);
    T.ok(ids.length >= 14, `${ids.length} sections: ${ids.join(', ')}`);
    for (const id of ['overview', 'types', 'values', 'framing', 'escaping', 'text', 'streaming', 'printing', 'cpp'])
      T.ok(ids.includes(id), `section ${id}`);
  });

  T.test('live demos load and decode', async () => {
    const demos = () => Array.from(d.querySelectorAll('[data-demo]'));
    await T.until(() => demos().length && demos().every((el) => el.querySelector('.g-demo-head, .callout')), 10000, 'demos');
    const failed = demos().filter((el) => el.querySelector('.callout.bad'));
    if (failed.length && failed.every((el) => /YAML parser|internet/i.test(el.textContent))) T.skip('js-yaml could not be loaded from cdnjs (offline?)');
    T.eq(failed.map((el) => `${el.dataset.demo}: ${el.textContent.trim().slice(0, 120)}`).join('\n'), '', 'demos that failed');
    T.ok(demos().length >= 10, `${demos().length} demos`);
    T.ok(d.querySelectorAll('.frame-card').length >= 10, 'decoded frames');
    T.ok(d.querySelectorAll('.print-out').length >= 2, 'printing demo output');
    T.eq(errors.join('\n'), '', 'JavaScript errors');
  });

  T.test('language selector: C code samples, C names, back to C++', async () => {
    const btn = (l) => d.querySelector(`#guide-lang button[data-lang="${l}"]`);
    const codeText = () => Array.from(d.querySelectorAll('.g-code')).map((p) => p.textContent).join('\n');
    const sec = () => d.getElementById('cpp');
    T.ok(btn('cpp') && btn('c'), 'language buttons');
    try { w.localStorage.removeItem('gmp-guide-lang'); } catch (_) { /* file:// */ }
    T.ok(/gmp::println/.test(codeText()) && btn('cpp').classList.contains('on'), 'C++ by default');
    btn('c').click();
    await T.until(() => /Generated C and errors/.test(sec().textContent), 3000, 'C section title');
    T.ok(btn('c').classList.contains('on') && !btn('cpp').classList.contains('on'), 'C selected');
    const c = codeText();
    for (const want of ['gmsg_printer_init_file', 'demo_link_stream_init', 'demo_status_view_from', 'LANG c', 'demo_link_stream_poll'])
      T.ok(c.includes(want), `C sample has ${want}`);
    T.ok(!/gmp::|std::/.test(c), 'no C++ left in the code samples');
    T.ok(sec().textContent.includes('GMSG_ERR_BAD_CHECKSUM'), 'C error names');
    T.ok(/C99 or later/.test(sec().textContent) && sec().textContent.includes('C_RUNTIME library'), 'C99 and the compiled runtime are described');
    T.ok(d.querySelector('#guide-nav').textContent.includes('Generated C and errors'), 'nav title');
    const demos = () => Array.from(d.querySelectorAll('[data-demo]'));
    await T.until(() => demos().length && demos().every((el) => el.querySelector('.g-demo-head, .callout')), 10000, 'demos after the switch');
    T.ok(d.querySelectorAll('.frame-card').length >= 10, 'demos decode again');
    T.ok(Array.from(d.querySelectorAll('.g-run-head')).some((h) => h.textContent.includes('guide_report_print')), 'C print demo label');
    let saved = 'c';
    try { saved = w.localStorage.getItem('gmp-guide-lang'); } catch (_) { /* file:// */ }
    T.eq(saved, 'c', 'choice remembered');
    btn('cpp').click();
    await T.until(() => /Generated C\+\+ and errors/.test(sec().textContent), 3000, 'C++ section title');
    T.ok(/gmp::println/.test(codeText()) && !/gmsg_printer_init_file/.test(codeText()), 'C++ samples again');
    T.eq(errors.join('\n'), '', 'JavaScript errors');
  });

  T.run();
})();
</script>
</body></html>
