<!doctype html>
<html><head><meta charset="utf-8"><title>Studio guide test</title></head>
<body style="margin:0">
<pre id="result">running</pre>
<iframe id="guide" style="width:1400px;height:1000px;border:0"></iframe>
<script src="lib.js"></script>
<script>
// Renders guide.html in a frame: every section, every live demo (real schemas decoded by the Studio code).
(async () => {
  const frame = document.getElementById('guide');
  await new Promise((resolve) => {
    frame.onload = resolve;
    frame.src = '../guide.html';
  });
  const d = frame.contentDocument, w = frame.contentWindow;
  const errors = [];
  w.addEventListener('error', (e) => errors.push(e.message));

  T.test('sections render', async () => {
    await T.until(() => d.querySelectorAll('section').length > 0, 5000, 'sections');
    const ids = Array.from(d.querySelectorAll('section[id]')).map((s) => s.id);
    T.ok(ids.length >= 14, `${ids.length} sections: ${ids.join(', ')}`);
    for (const id of ['overview', 'types', 'values', 'framing', 'escaping', 'text', 'streaming', 'printing', 'cpp'])
      T.ok(ids.includes(id), `section ${id}`);
  });

  T.test('live demos load and decode', async () => {
    const demos = () => Array.from(d.querySelectorAll('[data-demo]'));
    await T.until(() => demos().length && demos().every((el) => el.querySelector('.g-demo-head, .callout')), 10000, 'demos');
    const failed = demos().filter((el) => el.querySelector('.callout.bad'));
    if (failed.length && failed.every((el) => /YAML parser|internet/i.test(el.textContent))) T.skip('js-yaml could not be loaded from cdnjs (offline?)');
    T.eq(failed.map((el) => `${el.dataset.demo}: ${el.textContent.trim().slice(0, 120)}`).join('\n'), '', 'demos that failed');
    T.ok(demos().length >= 11, `${demos().length} demos`);
    const lim = d.querySelector('[data-demo="limits"]');
    T.ok(lim, 'value limits demo');
    T.ok(lim && lim.querySelectorAll('.frame-card').length === 3, 'value limits: 3 decoded examples');
    T.ok(lim && lim.querySelectorAll('.frame-card .bad, .frame-card.bad, .frame-card .err').length > 0, 'value limits: rejected examples are marked');
    T.ok(d.querySelectorAll('.frame-card').length >= 10, 'decoded frames');
    T.ok(d.querySelectorAll('.print-out').length >= 2, 'printing demo output');
    T.eq(errors.join('\n'), '', 'JavaScript errors');
  });

  T.test('language selector: C code samples, C names, back to C++', async () => {
    const btn = (l) => d.querySelector(`#guide-lang button[data-lang="${l}"]`);
    const codeText = () => Array.from(d.querySelectorAll('.g-code')).map((p) => p.textContent).join('\n');
    const sec = () => d.getElementById('cpp');
    T.ok(btn('cpp') && btn('c'), 'language buttons');
    try { w.localStorage.removeItem('gmp-guide-lang'); } catch (_) { /* file:// */ }
    T.ok(/gmsg::println/.test(codeText()) && btn('cpp').classList.contains('on'), 'C++ by default');
    btn('c').click();
    await T.until(() => /Generated C and errors/.test(sec().textContent), 3000, 'C section title');
    T.ok(btn('c').classList.contains('on') && !btn('cpp').classList.contains('on'), 'C selected');
    const c = codeText();
    for (const want of ['gmsg_printer_init_file', 'demo_link_stream_init', 'demo_status_view_from', 'LANG c', 'demo_link_stream_poll'])
      T.ok(c.includes(want), `C sample has ${want}`);
    T.ok(!/gmsg::|std::/.test(c), 'no C++ left in the code samples');
    T.ok(sec().textContent.includes('GMSG_ERR_BAD_CHECKSUM'), 'C error names');
    T.ok(/C99 or later/.test(sec().textContent) && sec().textContent.includes('C_RUNTIME library'), 'C99 and the compiled runtime are described');
    T.ok(d.querySelector('#guide-nav').textContent.includes('Generated C and errors'), 'nav title');
    const demos = () => Array.from(d.querySelectorAll('[data-demo]'));
    await T.until(() => demos().length && demos().every((el) => el.querySelector('.g-demo-head, .callout')), 10000, 'demos after the switch');
    T.ok(d.querySelectorAll('.frame-card').length >= 10, 'demos decode again');
    T.ok(Array.from(d.querySelectorAll('.g-run-head')).some((h) => h.textContent.includes('guide_report_print')), 'C print demo label');
    let saved = 'c';
    try { saved = w.localStorage.getItem('gmp-guide-lang'); } catch (_) { /* file:// */ }
    T.eq(saved, 'c', 'choice remembered');
    btn('cpp').click();
    await T.until(() => /Generated C\+\+ and errors/.test(sec().textContent), 3000, 'C++ section title');
    T.ok(/gmsg::println/.test(codeText()) && !/gmsg_printer_init_file/.test(codeText()), 'C++ samples again');
    T.eq(errors.join('\n'), '', 'JavaScript errors');
  });

  T.test('API reference: groups in both languages, filter', async () => {
    const btn = (l) => d.querySelector(`#guide-lang button[data-lang="${l}"]`);
    const sec = () => d.getElementById('api');
    const groups = () => Array.from(sec().querySelectorAll('[data-api-group]'));
    const visibleRows = () => Array.from(sec().querySelectorAll('[data-api-row]')).filter((r) => !r.hidden && !r.closest('[data-api-group]').hidden);
    btn('cpp').click();
    await T.until(() => sec() && groups().length, 3000, 'API section');
    const want = ['decode', 'views', 'fields', 'encode', 'text', 'enums', 'protocols', 'stream', 'poll', 'print', 'sizes', 'errors', 'checksums'];
    T.eq(groups().map((g) => g.dataset.apiGroup).join(','), want.join(','), 'C++ groups');
    const cppText = sec().textContent;
    for (const x of ['Status::decode(bytes)', 's.encode(out)', 'Link::parse(frame)', 'parser.poll_event()', 'gmsg::println', 'CallbackStream'])
      T.ok(cppText.includes(x), `C++ reference has ${x}`);
    T.ok(!/gmsg_printer_init|demo_status_decode/.test(cppText), 'no C names in the C++ reference');
    T.ok(!/\bnull\b|undefined/.test(cppText), 'no missing cells (C++)');
    T.ok(sec().querySelectorAll('.g-api-jump a').length === want.length, 'jump links');
    T.ok(want.every((id) => d.getElementById('api-' + id)), 'jump targets');

    const filter = () => d.getElementById('api-filter');
    filter().value = 'poll';
    filter().dispatchEvent(new w.Event('input', { bubbles: true }));
    const polled = visibleRows();
    T.ok(polled.length >= 5 && polled.every((r) => /poll/i.test(r.textContent + r.closest('[data-api-group]').textContent)), `filter "poll": ${polled.length} rows`);
    T.ok(groups().some((g) => g.hidden), 'groups without a match are hidden');

    btn('c').click();
    await T.until(() => /demo_status_decode/.test(sec().textContent), 3000, 'C reference');
    T.eq(filter().value, 'poll', 'filter kept after the language switch');
    T.ok(visibleRows().length >= 5 && visibleRows().every((r) => /poll/i.test(r.closest('[data-api-group]').textContent)), 'filter applied to the C reference');
    filter().value = 'zzzz-no-such-function';
    filter().dispatchEvent(new w.Event('input', { bubbles: true }));
    T.ok(visibleRows().length === 0 && !sec().querySelector('.g-api-none').hidden, 'no-match message');
    filter().value = '';
    filter().dispatchEvent(new w.Event('input', { bubbles: true }));
    const cText = sec().textContent;
    for (const x of ['demo_status_decode', 'demo_status_view_from', 'demo_link_encode_status_with_header', 'demo_link_stream_poll_event', 'gmsg_printer_finish', 'gmsg_crc32_compute', 'DEMO_LINK_MAX_FRAME'])
      T.ok(cText.includes(x), `C reference has ${x}`);
    T.ok(!/gmsg::|std::/.test(cText), 'no C++ names in the C reference');
    T.ok(!/\bnull\b|undefined/.test(cText), 'no missing cells (C)');
    btn('cpp').click();
    await T.until(() => /Status::decode/.test(sec().textContent), 3000, 'back to C++');
    filter().value = '';
    filter().dispatchEvent(new w.Event('input', { bubbles: true }));
    T.eq(errors.join('\n'), '', 'JavaScript errors');
  });

  T.test('language selector: JavaScript samples, names and API reference', async () => {
    const btn = (l) => d.querySelector(`#guide-lang button[data-lang="${l}"]`);
    const codeText = () => Array.from(d.querySelectorAll('.g-code')).map((p) => p.textContent).join('\n');
    T.ok(btn('js'), 'JavaScript button');
    btn('js').click();
    await T.until(() => /Generated JavaScript and errors/.test(d.getElementById('cpp').textContent), 3000, 'JavaScript section title');
    const c = codeText();
    for (const want of ['demo.Link.stream()', 'gmsg.print', 'demo.StatusView.from(bytes)', '--lang js', 'parser.pollEvent()', "parser.on('Status'"])
      T.ok(c.includes(want), `JavaScript sample has ${want}`);
    T.ok(!/gmsg::|std::|gmsg_\w+\(/.test(c), 'no C++ or C left in the code samples');
    T.ok(d.getElementById('cpp').textContent.includes('gmsg.Err.BadChecksum'), 'JavaScript error names');
    const api = d.getElementById('api').textContent;
    for (const x of ['demo.Status.decode(bytes)', 's.encode()', 'demo.Link.parse(frame)', 'parser.pollEvent()', 'gmsg.checksum.crc32.compute(bytes)', 'demo.Link.maxFrame', 'parser.messages(chunk)'])
      T.ok(api.includes(x), `JavaScript reference has ${x}`);
    T.ok(!/gmsg::|std::|demo_status_/.test(api), 'no C++ or C names in the JavaScript reference');
    T.ok(!/\bnull\b|undefined</.test(api), 'no missing cells (JavaScript)');
    const demos = () => Array.from(d.querySelectorAll('[data-demo]'));
    await T.until(() => demos().length && demos().every((el) => el.querySelector('.g-demo-head, .callout')), 10000, 'demos after the switch');
    T.ok(Array.from(d.querySelectorAll('.g-run-head')).some((h) => h.textContent.includes('console.log(String(report))')), 'JavaScript print demo label');
    btn('cpp').click();
    await T.until(() => /Generated C\+\+ and errors/.test(d.getElementById('cpp').textContent), 3000, 'back to C++');
    T.eq(errors.join('\n'), '', 'JavaScript errors');
  });

  T.test('language selector: Python samples, names and API reference', async () => {
    const btn = (l) => d.querySelector(`#guide-lang button[data-lang="${l}"]`);
    const codeText = () => Array.from(d.querySelectorAll('.g-code')).map((p) => p.textContent).join('\n');
    T.ok(btn('py'), 'Python button');
    btn('py').click();
    await T.until(() => /Generated Python and errors/.test(d.getElementById('cpp').textContent), 3000, 'Python section title');
    const c = codeText();
    for (const want of ['demo.Link.stream()', 'import link_gmp as demo', 'demo.StatusView.from_bytes(data)', '--lang python', 'parser.poll_event()',
      'parser.on(demo.Status', "status.to_text(style='single_line')", 'pip install ./runtime-py'])
      T.ok(c.includes(want), `Python sample has ${want}`);
    T.ok(!/gmsg::|std::|gmsg_\w+\(|console\.log|=>/.test(c), 'no C++, C or JavaScript left in the code samples');
    const gen = d.getElementById('cpp').textContent;
    T.ok(gen.includes('gmsg.Err.BAD_CHECKSUM') && gen.includes('gmsg.Err.PARSE_ERROR') && gen.includes('gmsg.Err.VALUE_OUT_OF_LIMITS'), 'Python error names');
    T.ok(gen.includes('@dataclass class M'), 'Python generated-code table');
    const api = d.getElementById('api').textContent;
    for (const x of ['demo.Status.decode(data)', 's.encode()', 'demo.Link.parse(frame)', 'parser.poll_event()', 'gmsg.checksum.crc32.compute(data)',
      'demo.Link.max_frame', 'parser.messages(chunk)', 'gmsg.use_native(False)', 'demo.Mode.name_of(v)'])
      T.ok(api.includes(x), `Python reference has ${x}`);
    T.ok(!/gmsg::|std::|demo_status_|pollEvent|toStruct/.test(api), 'no C++, C or JavaScript names in the Python reference');
    T.ok(!/\bnull\b|undefined</.test(api), 'no missing cells (Python)');
    const demos = () => Array.from(d.querySelectorAll('[data-demo]'));
    await T.until(() => demos().length && demos().every((el) => el.querySelector('.g-demo-head, .callout')), 10000, 'demos after the switch');
    T.ok(Array.from(d.querySelectorAll('.g-run-head')).some((h) => h.textContent.includes('print(report)')), 'Python print demo label');
    btn('cpp').click();
    await T.until(() => /Generated C\+\+ and errors/.test(d.getElementById('cpp').textContent), 3000, 'back to C++');
    T.eq(errors.join('\n'), '', 'JavaScript errors');
  });

  T.run();
})();
</script>
</body></html>
