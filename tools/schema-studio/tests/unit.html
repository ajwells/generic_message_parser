<!doctype html>
<html><head><meta charset="utf-8"><title>Studio unit tests</title></head>
<body>
<pre id="result">running</pre>
<script src="lib.js"></script>
<script src="../js/state.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/validate.js"></script>
<script src="../js/yaml.js"></script>
<script src="../../../runtime-js/gmsg.js"></script>
<script src="../js/decoder.js"></script>
<script src="../js/print.js"></script>
<script>
// Pure JS checks: no schema import (no network needed).
const G = window.GMP, D = G.decoder;
const arr = (u8) => Array.from(u8);

T.test('parseHex: separators, 0x prefixes and comments', () => {
  const r = D.parseHex('AA 55,0x01 # comment\n02\t0f');
  T.ok(!r.error, r.error);
  T.eqList(arr(r.bytes), [0xAA, 0x55, 0x01, 0x02, 0x0F], 'bytes');
});
T.test('parseHex: errors', () => {
  T.ok(/odd number/.test(D.parseHex('ABC').error || ''), 'odd digit count');
  T.ok(/not hex/.test(D.parseHex('ZZ').error || ''), 'bad token');
  T.eq(D.parseHex('   ').bytes.length, 0, 'empty input');
});
T.test('parseText: escapes', () => {
  const r = D.parseText('a\\r\\n\\t\\x41');
  T.ok(!r.error, r.error);
  T.eqList(arr(r.bytes), [0x61, 0x0D, 0x0A, 0x09, 0x41], 'bytes');
});
T.test('evalExpr: precedence, shifts, comparisons, references', () => {
  const env = { a: 1, b: 2, x: 3, y: 0 };
  const look = (r) => env[r];
  T.eq(D.evalExpr('1 + 2 * 3', look), 7);
  T.eq(D.evalExpr('(a << 16) | b', look), 65538);
  T.eq(D.evalExpr('x == 3 && y != 0', look), 0);
  T.eq(D.evalExpr('x == 3 || y != 0', look), 1);
  T.eq(D.evalExpr('(x - 1) * 4 >> 1', look), 4);
});
T.test('integer literals', () => {
  T.eq(G.parseInt('0x10'), 16);
  T.eq(G.parseInt('42'), 42);
  T.ok(G.isInt('0b101') || G.isInt('5'), 'isInt');
  T.ok(!G.isInt('abc'), 'not an int');
});
T.test('printer number formatting matches std::to_chars', () => {
  const P = G.printer;
  const cases = [
    [P.fmtGeneral(12.34, 9), '12.34'], [P.fmtGeneral(1e-5, 9), '1e-05'], [P.fmtGeneral(123456789012, 9), '1.23456789e+11'],
    [P.fmtGeneral(0.30000000000000004, 9), '0.3'], [P.fmtGeneral(-0, 9), '-0'],
    [P.fmtShortest(Math.fround(0.9), true), '0.9'], [P.fmtShortest(1e20, false), '1e+20'],
    [P.fmtShortest(123456, false), '123456'], [P.fmtShortest(0.0001, false), '1e-04'], [P.fmtShortest(0.001, false), '0.001'],
    [P.fmtShortest(1234567e10, false), '1.234567e+16'], [P.fmtShortest(1e-7, false), '1e-07'], [P.fmtShortest(-2.5, false), '-2.5'],
    [P.fmtShortest(NaN, false), 'nan'], [P.fmtShortest(-Infinity, false), '-inf'],
  ];
  cases.forEach(([a, b], i) => T.eq(a, b, `case ${i}`));
});
T.test('example schema validates and decodes its example input', () => {
  const s = G.exampleState();
  const errors = G.validate(s).filter((i) => i.level === 'error');
  T.eq(errors.length, 0, 'validation errors: ' + errors.map((e) => e.msg).join('; '));
  const p = s.protocols.find((x) => x.name === 'Link');
  T.ok(p, 'Link protocol');
  const input = D.exampleInput(s, 'protocol:Link');
  const r = D.decodeProtocol(s, p, D.parseHex(input).bytes);
  const frames = r.items.filter((i) => i.type === 'frame');
  T.ok(frames.length >= 3, 'frames found');
  T.ok(frames.some((f) => f.errors.length), 'the example contains a corrupted frame');
  T.ok(r.items.some((i) => i.type === 'garbage'), 'the example contains noise');
});
// ---- value limits and `max` (mirrors gmpc: generator/src/ir/lowering.cpp) ------------------------------------
const oneMessage = (fields) => {
  const s = G.emptyState();
  s.messages.push(G.newMessage({ name: 'M', fields: fields.map((f) => G.newField(f)) }));
  return s;
};
const errorsOf = (s) => G.validate(s).filter((i) => i.level === 'error').map((e) => e.msg);
const expectError = (fields, re, label) => {
  const errs = errorsOf(oneMessage(fields));
  T.ok(errs.some((m) => re.test(m)), `${label}: expected ${re}, got: ${errs.join(' | ') || 'no errors'}`);
};
const expectValid = (fields, label) => T.eq(errorsOf(oneMessage(fields)).join(' | '), '', label);

T.test('validation: max is only the capacity of variable-length data', () => {
  expectError([{ name: 'h', type: 'u16', max: '100' }], /not a value limit.*Use min_value \/ max_value/, 'scalar');
  expectError([{ name: 'b', type: 'bytes', lenMode: 'fixed', lenValue: '4', max: '8' }], /fixed size 4: 'max: 8' does not match/, 'fixed bytes');
  expectError([{ name: 'a', type: 'array', of: 'u8', lenMode: 'fixed', lenValue: '3', max: '4' }], /fixed count 3/, 'fixed array');
  expectValid([{ name: 'b', type: 'bytes', lenMode: 'fixed', lenValue: '4', max: '4' }], 'matching fixed size');
  expectValid([{ name: 'n', type: 'u8' }, { name: 'b', type: 'bytes', lenMode: 'expr', lenValue: 'n', max: '8' }], 'variable capacity');
});
T.test('validation: value limits', () => {
  expectError([{ name: 'r', type: 'u8', min_raw: '-1' }], /min_raw -1 .* outside the range of the raw value \(0\.\.255\)/, 'raw range');
  expectError([{ name: 'r', type: 'i8', max_value: '128' }], /outside the range/, 'unscaled value range');
  expectValid([{ name: 'r', type: 'u8', scale: '10', max_value: '5000' }], 'scaled limit beyond the raw range');
  expectError([{ name: 'r', type: 'u8', min_raw: '1.5' }], /must be an integer/, 'non-integer raw');
  expectError([{ name: 'r', type: 'u16', scale: '0.5', min_value: '5', max_value: '3' }], /min_value 5 .* greater than max_value 3/, 'order');
  expectError([{ name: 'r', type: 'u8', min_value: 'abc' }], /expected a number/, 'not a number');
  expectError([{ name: 's', type: 'bytes', lenMode: 'fixed', lenValue: '2', min_value: '1' }], /need a numeric scalar field/, 'bytes');
  expectError([{ name: 'c', type: 'u8', const: '5', max_raw: '9' }], /'const' field/, 'const');
  expectValid([{ name: 'r', type: 'u64', min_raw: '0x8000000000000000', max_raw: '0xFFFFFFFFFFFFFFFF' }], 'u64 extremes');
  const bits = (b) => [{ name: 'g', type: 'bits', bits: [G.newBit({ name: 'x', bits: '3', ...b }), G.newBit({ pad: true, bits: '5' })] }];
  expectError(bits({ max_raw: '8' }), /outside the range of the raw value \(0\.\.7\)/, 'bit width');
  expectError(bits({ type: 'i8', min_raw: '-5' }), /\(-4\.\.3\)/, 'signed bits');
  expectValid(bits({ max_raw: '7', scale: '0.5', max_value: '3' }), 'bit limits');
  expectError([{ name: 'a', type: 'array', of: 'u8', lenMode: 'fixed', lenValue: '2', ofLimits: { min_value: '', max_value: '', min_raw: '', max_raw: '300' } }],
    /the array element is outside the range/, 'element range');
});
T.test('limitError: inclusive bounds, exact 64-bit integers, scaled doubles, NaN', () => {
  const f = G.newField({ type: 'u16', scale: '0.0019073486328125', offset: '-6', min_value: '0', max_value: '100' });
  T.ok(G.limitError(f, 'u16', 3145n) !== '', '3145 scales below 0');
  T.eq(G.limitError(f, 'u16', 3146n), '', '3146');
  T.eq(G.limitError(f, 'u16', 55574n), '', '55574');
  T.ok(G.limitError(f, 'u16', 55575n) !== '', '55575 scales above 100');
  const big = G.newField({ type: 'u64', min_raw: '0x8000000000000000' });
  T.eq(G.limitError(big, 'u64', 0x8000000000000000n), '', '2^63');
  T.ok(G.limitError(big, 'u64', 0x7FFFFFFFFFFFFFFFn) !== '', '2^63 - 1 (not representable as a double)');
  const fl = G.newField({ type: 'f32', min_value: '-1.5', max_value: '1.5' });
  T.eq(G.limitError(fl, 'f32', 1.5), '', '1.5');
  T.ok(G.limitError(fl, 'f32', NaN) !== '', 'NaN');
  T.ok(/above max_value 1\.5/.test(G.limitError(fl, 'f32', 2)), 'message');
});
T.test('yaml export: limits on fields, bit fields and array elements; max kept where set', () => {
  const s = oneMessage([
    { name: 'h', type: 'u16', scale: '0.5', min_value: '0', max_value: '100', min_raw: '0x10' },
    { name: 'a', type: 'array', of: 'i8', lenMode: 'fixed', lenValue: '2', ofLimits: { min_value: '-50', max_value: '', min_raw: '', max_raw: '' } },
    { name: 'g', type: 'bits', bits: [G.newBit({ name: 'x', bits: '8', max_raw: '5' })] },
    { name: 'k', type: 'u8', max: '10' },
  ]);
  const y = G.toYaml(s);
  T.ok(/name: h, type: u16, scale: 0\.5, min_value: 0, max_value: 100, min_raw: 0x10/.test(y), 'field limits:\n' + y);
  T.ok(/of: \{ type: i8, min_value: -50 \}/.test(y), 'element limits:\n' + y);
  T.ok(/name: x, bits: 8, max_raw: 5/.test(y), 'bit limits:\n' + y);
  T.ok(/name: k, type: u8, max: 10/.test(y), 'max kept on a scalar (gmpc reports it):\n' + y);
});
T.run();
</script>
</body></html>
