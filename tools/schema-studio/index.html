<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GMP Schema Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="18" height="4" rx="1.5"/><rect x="3" y="9" width="11" height="6" rx="1.5"/><rect x="16" y="9" width="5" height="6" rx="1.5"/><rect x="3" y="17" width="18" height="4" rx="1.5"/></svg>
      </span>
      <span class="brand-name">GMP Schema Studio</span>
      <span class="brand-sub">YAML schema builder for gmpc</span>
    </div>
    <div class="topbar-actions">
      <a class="btn ghost" href="guide.html" title="A visual guide to every GMP feature, with live decoded examples">Guide</a>
      <button class="btn ghost" data-action="newSchema" title="Start an empty schema">New</button>
      <button class="btn ghost" data-action="loadExample" title="Load an example schema">Example</button>
      <button class="btn ghost" data-action="importYaml" title="Import an existing .yaml schema">Import…</button>
      <button class="btn primary" data-action="downloadYaml" title="Download the YAML file">Download YAML</button>
      <input type="file" id="import-file" accept=".yaml,.yml,text/yaml" hidden>
    </div>
  </header>

  <main class="workspace">
    <section class="pane left" id="left-pane" aria-label="Schema options"></section>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
    <section class="pane right" aria-label="Preview">
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="layout" role="tab">Layout</button>
        <button class="tab" data-tab="yaml" role="tab">YAML</button>
        <button class="tab" data-tab="decode" role="tab">Decode tester</button>
        <div class="tabs-spacer"></div>
        <div class="legend" id="legend"></div>
      </nav>
      <div class="tab-body" id="tab-layout"></div>
      <div class="tab-body hidden" id="tab-yaml"></div>
      <div class="tab-body hidden" id="tab-decode"></div>
      <footer class="issues" id="issues"></footer>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/state.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/yaml.js"></script>
  <script src="js/tips.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/viz.js"></script>
  <script src="js/decoder.js"></script>
  <script src="js/print.js"></script>
  <script src="js/decode-view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
