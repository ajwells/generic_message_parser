schema_version: "1.1"
name: humidity-range-check
expected_outcome: |
  Explains that `max` is a container capacity (for variable-length strings, bytes and arrays), not a value limit,
  which is why gmpc rejects it on a scalar field. Recommends replacing it with value limits in the schema:
  `min_value: 0, max_value: 100` (compared with the scaled value, %RH) or `max_raw: 10000` (the raw wire value), and
  says that decoding (struct and view) and encoding then fail with `ValueOutOfLimits` for 0xFFFF. Any schema it
  shows passes `gmpc --check`, and it does not invent other schema keys.
