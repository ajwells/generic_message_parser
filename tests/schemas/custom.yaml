schema_version: 1
namespace: ext

custom:
  types:
    nmea_coord:
      cpp: { header: "test_codecs.hpp", type: "double", decode: "test::decode_coord", encode: "test::encode_coord" }
      c: { header: "test_codecs_c.h", type: "double", decode: "test_coord_decode", encode: "test_coord_encode" }
      js: { module: "./test_codecs.js", decode: decodeCoord, encode: encodeCoord }
  framers:
    len_byte:
      cpp: { header: "test_codecs.hpp", type: "test::LengthByteFramer" }
      c: { header: "test_codecs_c.h", scan: "test_len_byte_scan" }
      js: { module: "./test_codecs.js", scan: lenByteScan }

messages:
  Pos:
    format: text
    type_id: POS
    fields:
      - { name: lat, type: nmea_coord }
      - { name: lon, type: nmea_coord, optional: true }
  Blob:
    access: view
    fields:
      - { name: kind, type: u8 }
      - { name: data, type: bytes, length: remaining }

protocols:
  TextPos:
    format: text
    framing: { type: delimited, end: "\n", max_frame: 64 }
    message_type: { token: 0 }
    messages: [Pos]
  Custom:
    header: [ { name: n, type: u8 } ]
    framing: { type: custom, framer: len_byte, max_frame: 256 }
    messages: [Blob]
