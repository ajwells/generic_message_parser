schema_version: 1
namespace: link::hdlc
defaults: { endian: little }

custom:
  types:
    bcd_time:
      wire_size: 3
      cpp: { header: "test_codecs.hpp", type: "test::Time", decode: "test::decode_bcd_time", encode: "test::encode_bcd_time" }
      c: { header: "test_codecs_c.h", type: "test_time", decode: "test_bcd_time_decode", encode: "test_bcd_time_encode", print: "test_time_print" }
  checksums:
    add16:
      size: 2
      cpp: { header: "test_codecs.hpp", function: "test::add16" }
      c: { header: "test_codecs_c.h", function: "test_add16" }

messages:
  Reading:
    fields:
      - { name: channel, type: u8 }
      - { name: name_len, type: u8 }
      - { name: name, type: string, length: name_len, max: 16 }
      - { name: value, type: f32 }
  Batch:
    type_id: 0x10
    fields:
      - { name: when, type: bcd_time }
      - { name: n, type: u8 }
      - { name: readings, type: array, of: Reading, count: n, max: 8 }
      - { name: crc_in_payload, type: u32, when: "n > 2" }
  Ping:
    type_id: 0x11
    fields:
      - { name: seq, type: u32 }
      - { name: payload, type: bytes, length: 4 }

protocols:
  Hdlc:
    header:
      - { name: address, type: u8, const: 0xFF }
      - { name: kind, type: u8 }
    framing:
      type: delimited
      start: [0x7E]
      end: [0x7E]
      escape: { char: 0x7D, xor: 0x20 }
    checksum: { algo: crc16_x25, covers: header_body, endian: little }
    message_type: { field: kind }
    messages: [Batch, Ping]

  Summed:
    header:
      - { name: kind, type: u8 }
    framing: { type: delimited, start: [0xC0], end: [0xC0], escape: { char: 0xDB, map: { 0xC0: 0xDC, 0xDB: 0xDD } } }
    checksum: { algo: add16 }
    message_type: { field: kind }
    messages: [Ping]
